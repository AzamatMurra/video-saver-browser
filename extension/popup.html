<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, -apple-system, sans-serif; font-size: 13px;
         width: 340px; margin: 0; padding: 12px; box-sizing: border-box; }
  h1 { font-size: 14px; margin: 0 0 6px; }
  #title { color: #888; font-size: 12px; margin-bottom: 8px; overflow: hidden;
           text-overflow: ellipsis; white-space: nowrap; }
  .lbl { display: block; font-size: 12px; color: #888; margin: 6px 0 2px; }
  input[type=text], select { width: 100%; box-sizing: border-box; margin: 2px 0;
          padding: 6px; border-radius: 6px; border: 1px solid #8888; }
  input[type=number] { width: 70px; padding: 5px; border-radius: 6px;
          border: 1px solid #8888; }
  #streamsWrap { display: none; }
  #go { width: 100%; padding: 9px; font-size: 14px; font-weight: 600;
        border: 0; border-radius: 8px; color: #fff; background: #2563eb;
        cursor: pointer; margin: 8px 0; }
  #go:disabled { opacity: .5; cursor: default; }
  #status { min-height: 20px; font-size: 12px; color: #444; word-break: break-word; }
  #jobs { margin-top: 8px; border-top: 1px solid #8884; padding-top: 8px; }
  .empty { color: #999; font-size: 12px; text-align: center; padding: 10px 0; }
  .job { padding: 6px 8px; border-radius: 8px; background: #8881; margin: 4px 0;
         border-left: 3px solid #8888; }
  .job.done { border-left-color: #16a34a; }
  .job.error { border-left-color: #dc2626; }
  .job.downloading { border-left-color: #2563eb; }
  .jhead { display: flex; gap: 6px; align-items: baseline; }
  .jstate { font-size: 11px; color: #555; white-space: nowrap; }
  .jname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .jsub { font-size: 11px; color: #666; margin-top: 2px; word-break: break-all; }
  progress { width: 100%; height: 8px; margin-top: 4px; border-radius: 4px; }
  #meta { font-size: 11px; color: #999; margin-top: 8px; }
  #clearBtn, #settingsBox summary { width: 100%; padding: 7px; font-size: 12px;
        border: 1px solid #8888; border-radius: 8px; background: transparent;
        color: #666; cursor: pointer; margin-top: 6px; text-align: center; }
  #settingsBox { margin-top: 2px; }
  #settingsBox .row { display: flex; gap: 8px; align-items: center;
                      justify-content: space-between; }
  .err { color: #dc2626; }
  .ok { color: #16a34a; }
</style>
</head>
<body>
  <h1>⬇ Скачать видео со звуком</h1>
  <div id="title"></div>
  <label class="lbl">Название файла (заголовок страницы)</label>
  <input type="text" id="name">
  <label class="lbl">Папка для файлов</label>
  <input type="text" id="saveDir" placeholder="~/Downloads">
  <div id="streamsWrap">
    <label class="lbl">Найдено потоков (<span id="streamCount">0</span>):</label>
    <select id="streams"></select>
  </div>
  <label class="lbl">Качество</label>
  <select id="fmt">
    <option value="best">Лучшее (1080p)</option>
    <option value="lite">Лёгкое (до 480p)</option>
  </select>
  <button id="go">Добавить в очередь</button>
  <div id="status"></div>
  <div id="jobs"><div class="empty">Загрузок пока нет</div></div>
  <details id="settingsBox">
    <summary>⚙ Настройки</summary>
    <div class="row"><span class="lbl">Одновременных загрузок</span><input type="number" id="setCon" min="1" max="5"></div>
    <div class="row"><span class="lbl">Добавлять тег стрима к имени файла</span><input type="checkbox" id="setTag"></div>
  </details>
  <button id="clearBtn">🗑 Очистить историю</button>
  <div id="meta"></div>
  <script src="popup.js"></script>
</body>
</html>
